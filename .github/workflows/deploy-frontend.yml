# Build the SPA and publish it (FZ-166).
#
# Extracted from deploy.yml for the same reason as the image build: the bucket and the
# distribution live in infra/shared and serve both postures (FZ-159), so publishing the
# frontend cannot be a step inside the ECS rollout. On the single box it never ran at all.
#
# Nothing here touches compute. It is safe to run at any time, and it is the whole of a
# frontend-only release.
name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish to
        required: true
        default: beta
        type: choice
        options: [beta]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # VITE_API_BASE_URL is baked into the bundle at build time and there is no runtime
      # override: a browser cannot be told the API address after the fact. Without it
      # client.ts falls back to http://localhost:8099, and the deploy succeeds while every
      # request from the published site goes nowhere (FZ-123 — found by building by hand and
      # noticing the workflow never set it).
      - name: Build the frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          # Without these the build falls back to the development sign-in form, whose
          # endpoint does not exist outside the local profile — so the site deploys and
          # nobody can sign in (FZ-179). Checked, not hoped.
          VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "API_BASE_URL is not set; the build would ship pointing at localhost"; exit 1; }
          test -n "$VITE_COGNITO_DOMAIN" || { echo "COGNITO_HOSTED_UI_DOMAIN is not set; the build would ship the development sign-in"; exit 1; }
          test -n "$VITE_COGNITO_CLIENT_ID" || { echo "COGNITO_CLIENT_ID is not set; the build would ship the development sign-in"; exit 1; }
          npm ci
          npm run build

      # --delete so a file removed from the build is removed from the bucket; otherwise a
      # deleted page keeps being served indefinitely.
      - name: Publish the frontend
        run: aws s3 sync frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete

      # Without this, CloudFront keeps serving the previous build until the cache expires,
      # and the deploy looks like it did nothing.
      - name: Invalidate the cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'
