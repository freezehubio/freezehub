# Build the SPA and publish it (FZ-166).
#
# Extracted from deploy.yml for the same reason as the image build: the bucket and the
# distribution live in infra/shared and serve both postures (FZ-159), so publishing the
# frontend cannot be a step inside the ECS rollout. On the single box it never ran at all.
#
# Nothing here touches compute. It is safe to run at any time, and it is the whole of a
# frontend-only release.
name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish to
        required: true
        default: beta
        type: choice
        options: [beta]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # NO `environment:` HERE, and it is not an oversight (FZ-206). A job that declares one
    # makes GitHub change the OIDC subject claim from
    #   repo:freezehubio/freezehub:ref:refs/heads/master
    # to
    #   repo:freezehubio/freezehub:environment:beta
    # and the trust policy in infra/shared/github-oidc.tf allows only the first. The first
    # real release failed here, on both jobs that declared one and on neither that did not.
    #
    # Keeping the branch in the subject is the point rather than a workaround: it is IAM
    # that then enforces "only master deploys", which a repository admin cannot change. An
    # environment's deployment-branch rule is the same restriction owned by someone else.
    #
    # `beta` carried no protection rules and no scoped secrets, so it was enforcing nothing
    # and granting nothing. Every variable and secret these workflows read is repository-level.


    steps:
      - uses: actions/checkout@v7

      # Fail fast (FZ-183). Asking before the build costs a second and saves the whole
      # build when the answer was never going to be yes. FZ-182 argued the opposite and
      # was wrong: it claimed checking first "wastes the ten minutes anyway", when
      # checking first is exactly what saves them.
      #
      # This is an optimisation, not the gate. The gate is the second check below, and it
      # cannot be replaced by this one — see the comment there.
      #
      # `on-error: allow` deliberately, and only here. If FreezeHub blips for a second at
      # minute zero, losing a build to something that is not a freeze is a bad trade when
      # an authoritative check runs later anyway. A missing key or a wrong URL still fails
      # the step: that switch has never covered setup problems, precisely so enforcement
      # cannot be disabled by breaking the integration.
      - name: Ask FreezeHub early, to avoid building what we cannot ship
        uses: ./connectors
        with:
          url: ${{ vars.FREEZEHUB_URL }}
          api-key: ${{ secrets.FREEZEHUB_API_KEY }}
          application: freezehub-frontend
          environment: ${{ inputs.environment }}
          on-error: allow

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # VITE_API_BASE_URL is baked into the bundle at build time and there is no runtime
      # override: a browser cannot be told the API address after the fact. Without it
      # client.ts falls back to http://localhost:8099, and the deploy succeeds while every
      # request from the published site goes nowhere (FZ-123 — found by building by hand and
      # noticing the workflow never set it).
      - name: Build the frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          # Without these the build falls back to the development sign-in form, whose
          # endpoint does not exist outside the local profile — so the site deploys and
          # nobody can sign in (FZ-179). Checked, not hoped.
          VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          # **No `test -n` guard on this one, and that is the difference** (`FZ-213`).
          # The three above are wrong when absent — the site ships pointing at localhost or
          # offering a sign-in nobody can use. This one is *correct* when absent: until a
          # scheduler exists there is no time to offer, and the form simply does not show a
          # "Pick a time" button. Guarding it would refuse to deploy over a feature that has
          # not been set up yet.
          #
          # **Setting this adds a subprocessor.** Whoever the calendar belongs to receives a
          # prospect's name, email and meeting time, which makes them an encargado: they need
          # a row in `legal/subprocessors.md` and a line in the Política's transmisión table,
          # and the DPA commits to 30 days' notice before that list changes. Nothing is owed
          # while this variable is empty, which is why the obligation is recorded here — at
          # the point where somebody fills it in — rather than in a document they would have
          # to already be reading.
          VITE_DEMO_BOOKING_URL: ${{ vars.DEMO_BOOKING_URL }}
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "API_BASE_URL is not set; the build would ship pointing at localhost"; exit 1; }
          test -n "$VITE_COGNITO_DOMAIN" || { echo "COGNITO_HOSTED_UI_DOMAIN is not set; the build would ship the development sign-in"; exit 1; }
          test -n "$VITE_COGNITO_CLIENT_ID" || { echo "COGNITO_CLIENT_ID is not set; the build would ship the development sign-in"; exit 1; }
          npm ci
          npm run build

      # THE GATE (FZ-182, corrected by FZ-183). The connector this runs is the one
      # customers run — `./connectors`, not a copy — so if it is wrong for us it is wrong
      # for them.
      #
      # Immediately before the publish, and the early check above does not make this one
      # redundant: A FREEZE CAN BEGIN DURING THE BUILD. Announced at minute three of a
      # forty-minute pipeline, it would be missed entirely by a check at minute zero, and
      # the deploy would go out into a live freeze — the exact failure this product exists
      # to prevent, committed by the product itself. The early check is cheap; this one is
      # correct. Narrowing the window between the answer and the deploy to seconds is the
      # whole reason this step sits here.
      #
      # It fails closed: no `on-error` override, unlike the early check. If FreezeHub is
      # unreachable this job stops, which is the behaviour we ask customers to accept and
      # should therefore live with ourselves.
      - name: Ask FreezeHub whether this may deploy
        uses: ./connectors
        with:
          url: ${{ vars.FREEZEHUB_URL }}
          api-key: ${{ secrets.FREEZEHUB_API_KEY }}
          application: freezehub-frontend
          environment: ${{ inputs.environment }}

      # After the freeze check, for the same reason it is before it in
      # deploy-singlebox.yml: a deploy that is not allowed should not assume a role. The
      # build above needs no AWS access, so nothing is lost by waiting.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # --delete so a file removed from the build is removed from the bucket; otherwise a
      # deleted page keeps being served indefinitely.
      - name: Publish the frontend
        run: aws s3 sync frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete

      # Without this, CloudFront keeps serving the previous build until the cache expires,
      # and the deploy looks like it did nothing.
      - name: Invalidate the cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'
