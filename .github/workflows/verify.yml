# Everything that can be checked without an AWS account (FZ-064).
#
# Four jobs rather than one, so a frontend lint failure does not hide a backend test
# failure — the point of CI is finding every problem in one run, not the first one.
#
# **Actions stay on floating major tags, deliberately** (`FZ-140`, `OI-33`) — the opposite
# of the rule the Dockerfiles follow (`FZ-139`), because they are opposite things. A base
# image is what ships to customers, so it is pinned and its contents reviewed; an action is
# what inspects what ships, and freezing the inspector means it quietly stops learning
# about new vulnerabilities. `aquasecurity/trivy-action` is the one exception, pinned by
# SHA since `FZ-127`: it is third-party, runs on every pull request, and is a composite
# action, so the Node runtime bumps below do not touch it.
#
# Every major named here targets node24. GitHub deprecated node20 and is force-running it
# on a newer runtime; these moved before the day that forcing stops, not after.
name: Verify

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: nothing here writes anything.
permissions:
  contents: read

# A superseded run tells you about code nobody is looking at any more.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs the integration tests, which start a real PostgreSQL through
      # Testcontainers. GitHub-hosted runners have a working Docker daemon, so this needs
      # no service container — the tests bring their own database and run Liquibase
      # against it, which is what makes the migrations part of what CI checks.
      - name: Build and test
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails if
      # package.json and the lockfile disagree, which is the difference worth catching
      # here rather than on somebody's laptop.
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      # Type errors only surface here: `tsc -b` runs as part of the build, not the tests.
      - name: Build
        working-directory: frontend
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      # `-backend=false` is what makes this need no AWS credentials at all: it installs
      # providers and checks the configuration without touching state or the account.
      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate the state bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  connectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The deployment gate customers run. A change here changes what every one of their
      # pipelines does, so this job checks behaviour and not only that the file parses.
      - name: Check the deployment gate parses
        run: sh -n connectors/freeze-check.sh

      - name: Check it is executable
        run: test -x connectors/freeze-check.sh

      # Most of what this asserts is the set of rules that must not fail open: a missing
      # variable, a rejected credential, an unrecognised decision. Each is one branch away
      # from a pipeline that deploys during a freeze and reports success.
      - name: Test the deployment gate
        run: node connectors/test/run-tests.js

      # An input declared but never wired reaches the customer as a setting that
      # silently does nothing, and a credential in the wrong place reaches them as a
      # credential in the wrong place. Structural, so it runs on a laptop too.
      - name: Check the connectors
        run: node connectors/test/check-connectors.js

      - name: Build the connector image
        run: docker build -t freeze-check:test connectors/

      # Only what packaging can break: that busybox ash runs the script, that the exit
      # code survives the container boundary, and that it is not root. It needs no
      # network, so it behaves the same here as on a laptop.
      - name: Smoke-test the connector image
        run: sh connectors/test/image-smoke.sh freeze-check:test

  # The GitHub Action, actually executed. check-connectors.js covers its shape on a laptop;
  # only a runner can prove the composite step resolves the script and that a blocked
  # deployment fails the job — which is the entire purpose of the thing.
  github-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start a stub Policy API
        run: |
          mkdir -p "$RUNNER_TEMP/stub"
          printf '%s' '{"status":200,"body":{"decision":"ALLOW","message":"No restriction is in force.","restrictions":[],"unregistered":[]}}' > "$RUNNER_TEMP/stub/response.json"
          node connectors/test/stub-server.js "$RUNNER_TEMP/stub" &
          for _ in $(seq 1 100); do [ -f "$RUNNER_TEMP/stub/port" ] && break; sleep 0.1; done
          test -f "$RUNNER_TEMP/stub/port" || { echo "the stub server did not start" >&2; exit 1; }
          echo "STUB_URL=http://127.0.0.1:$(cat "$RUNNER_TEMP/stub/port")" >> "$GITHUB_ENV"

      - name: An allowed deployment passes
        uses: ./connectors
        with:
          url: ${{ env.STUB_URL }}
          api-key: fzh_test
          application: payments-api
          environment: production

      - name: Freeze the stub
        run: printf '%s' '{"status":200,"body":{"decision":"BLOCK","message":"A hard freeze is in force.","restrictions":[{"name":"Black Friday Freeze","level":"HARD_FREEZE","reason":"Revenue-critical period","endsAt":"2026-12-02T00:00:00Z"}],"unregistered":[]}}' > "$RUNNER_TEMP/stub/response.json"

      - name: A blocked deployment fails
        id: blocked
        continue-on-error: true
        uses: ./connectors
        with:
          url: ${{ env.STUB_URL }}
          api-key: fzh_test
          application: payments-api
          environment: production

      - name: Reject the stub credential
        run: printf '%s' '{"status":401,"body":{"title":"Unauthorized"}}' > "$RUNNER_TEMP/stub/response.json"

      # The one that would be invisible if it broke: on-error=allow covers a FreezeHub
      # outage, never a rejected key. If it did, revoking a key would switch the gate
      # off for every workflow still using it, and every one of them would go green.
      - name: A rejected credential fails even when asked to fail open
        id: rejected
        continue-on-error: true
        uses: ./connectors
        with:
          url: ${{ env.STUB_URL }}
          api-key: fzh_revoked
          application: payments-api
          environment: production
          on-error: allow

      - name: Both refusals must have failed the step
        run: |
          status=0
          [ "${{ steps.blocked.outcome }}" = "failure" ] || { echo "a BLOCK decision did not fail the step" >&2; status=1; }
          [ "${{ steps.rejected.outcome }}" = "failure" ] || { echo "a rejected credential did not fail the step" >&2; status=1; }
          exit $status

  # Dependency and image scanning (FZ-127, OI-24).
  #
  # Trivy covers all three trees this repository ships — Maven, npm and the base images —
  # which is why it is one tool rather than three. `HIGH,CRITICAL` is the gate and it is
  # written here rather than left to a default; anything below that is reported by the
  # scheduled run and does not block a pull request.
  #
  # The Maven scan resolves the dependency tree from the local repository, which is why it
  # runs `dependency:go-offline` first: without a populated `~/.m2`, Trivy resolves every
  # POM over the network and Maven Central answers `429 Too Many Requests` with a
  # half-hour block. That is not hypothetical — it happened while this job was being
  # written.
  #
  # The base images are scanned by name rather than by building the application image. The
  # shipped image is base + jar, and both halves are covered: the jar's dependencies by the
  # Maven scan, the base by these. Building the image here would cost a full Maven build
  # inside Docker to learn the same two things.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Populate the Maven repository
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests dependency:go-offline

      - name: Scan the backend dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      - name: Scan the frontend dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: frontend/node_modules
          trivyignores: .trivyignore.yaml

      # The base images the Dockerfiles start FROM — read out of the Dockerfiles rather
      # than written again here (FZ-139). They are pinned by digest now, and a digest
      # copied into two files is a digest that will disagree with itself: the scan would
      # keep passing against a base the build stopped using, which is a worse failure than
      # no scan because it reads as evidence.
      #
      # The runtime stage, not the build stage: only the jar leaves the build stage, so
      # what ships is this one plus the application's own dependencies, scanned above.
      - name: Resolve the base images from the Dockerfiles
        id: bases
        run: |
          backend=$(awk '$1 == "FROM" && $NF == "runtime" { print $2 }' backend/Dockerfile)
          connector=$(awk '$1 == "FROM" { print $2; exit }' connectors/Dockerfile)
          test -n "$backend" && test -n "$connector" || {
            echo "could not read a FROM line; refusing to scan nothing" >&2; exit 1; }
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "connector=$connector" >> "$GITHUB_OUTPUT"
          echo "scanning $backend and $connector"

      - name: Scan the backend base image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.bases.outputs.backend }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      - name: Scan the connector base image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.bases.outputs.connector }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore.yaml
