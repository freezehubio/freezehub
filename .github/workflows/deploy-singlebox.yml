# Deploy to the single-box beta (FZ-154, D-35).
#
# By SSM Run Command, not SSH. That removes the open port, the key somebody has to hold,
# and the question of who still has a copy — and it turns every deploy into an IAM-
# authorised API call recorded in CloudTrail. The instance has no port 22 at all
# (FZ-152).
#
# Manual, like deploy.yml: publishing changes what customers reach, and freeze-check.sh
# fails closed, so a deploy is the one moment FreezeHub can block every customer at once.
name: Deploy single-box

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Exact image tag to run, e.g. v1.2.3 or a commit SHA. Never "latest".'
        required: true
      instance_id:
        description: 'Target instance (terraform -chdir=infra/singlebox output -raw instance_id)'
        required: true

permissions:
  contents: read
  id-token: write # OIDC to AWS. No stored keys anywhere in this workflow.

concurrency:
  group: deploy-singlebox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A moving tag in a deploy gate changes behaviour on a day nobody touched it — the
      # same reasoning FZ-099 applies to the connector image. Cheaper to refuse here.
      - name: Refuse a moving tag
        run: |
          case "${{ inputs.image_tag }}" in
            latest|main|master|"") echo "image_tag must be an exact tag, got '${{ inputs.image_tag }}'" >&2; exit 1 ;;
          esac

      # FreezeHub asks FreezeHub (FZ-182). The connector this runs is the one customers
      # run — `./connectors`, not a copy — so if it is wrong for us it is wrong for them.
      #
      # Before the AWS credentials step on purpose: a frozen deploy should not assume a
      # role at all. The check needs no cloud access, only the Policy API and a key, which
      # is also why it works while OI-43 keeps the rest of this workflow from running.
      #
      # It fails closed. If FreezeHub is unreachable this job stops, which is the
      # behaviour we ask customers to accept and should therefore live with ourselves.
      - name: Ask FreezeHub whether this may deploy
        uses: ./connectors
        with:
          url: ${{ vars.FREEZEHUB_URL }}
          api-key: ${{ secrets.FREEZEHUB_API_KEY }}
          application: freezehub-backend
          environment: ${{ vars.ENVIRONMENT || 'beta' }}

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send the deploy
        id: send
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ vars.ECR_REPOSITORY_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT || 'beta' }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          set -euo pipefail

          # The values go into /opt/freezehub/.env rather than being exported for the
          # length of one command (FZ-178).
          #
          # Exporting them made every subsequent `docker compose` fail: compose.yaml uses
          # ${VAR:?} throughout, so interpolation needs them for `ps` and `logs` and `exec`
          # too, not only for `up`. Every command in 14-operations.md is a `docker compose`
          # command, which meant the runbook written to diagnose a broken box could not be
          # run on one. Found by trying to use it.
          #
          # The file holds the database password and the encryption key at 0600. That is a
          # real cost and it is smaller than it looks: both values are already readable by
          # anyone who can run docker here, through `docker inspect` or /proc/<pid>/environ.
          # It does not widen who can read them; it removes a runbook nobody could use.
          #
          # The stack files travel with the command rather than being baked into the AMI,
          # so what runs on the box is what is in this commit and can be diffed.
          COMPOSE_B64=$(base64 < deploy/compose.yaml | tr -d '\n')
          CADDY_B64=$(base64 < deploy/Caddyfile | tr -d '\n')

          # The backup travels with the deploy too (OI-46). Before this nothing installed
          # it: no script on the box, no unit, no timer, and an empty bucket — while
          # FZ-155 described itself as waiting only on a restore drill. With PostgreSQL on
          # a root volume marked delete_on_termination, this dump is the only thing between
          # an instance replacement and losing everything.
          BACKUP_B64=$(base64 < deploy/backup.sh | tr -d '\n')
          BACKUP_SERVICE_B64=$(base64 < deploy/freezehub-backup.service | tr -d '\n')
          BACKUP_TIMER_B64=$(base64 < deploy/freezehub-backup.timer | tr -d '\n')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "FreezeHub deploy ${IMAGE_TAG}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters commands="[\"set -euo pipefail\",\
          \"cd /opt/freezehub\",\
          \"echo $COMPOSE_B64 | base64 -d > compose.yaml\",\
          \"echo $CADDY_B64 | base64 -d > Caddyfile\",\
          \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${REGISTRY%%/*}\",\
          \"umask 077\",\
          \"rm -f .env\",\
          \"echo BACKEND_IMAGE=${REGISTRY}:${IMAGE_TAG} >> .env\",\
          \"echo API_DOMAIN=${API_DOMAIN} >> .env\",\
          \"echo APP_DOMAIN=${APP_DOMAIN} >> .env\",\
          \"echo AWS_REGION=${AWS_REGION} >> .env\",\
          \"echo COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID} >> .env\",\
          \"echo COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID} >> .env\",\
          \"echo DATABASE_PASSWORD=\\\$(aws ssm get-parameter --name /freezehub-${ENVIRONMENT}/database-password --with-decryption --query Parameter.Value --output text --region $AWS_REGION) >> .env\",\
          \"echo ENCRYPTION_KEY=\\\$(aws ssm get-parameter --name /freezehub-${ENVIRONMENT}/encryption-key --with-decryption --query Parameter.Value --output text --region $AWS_REGION) >> .env\",\
          \"chmod 600 .env\",\
          \"echo $BACKUP_B64 | base64 -d > backup.sh\",\
          \"chmod 700 backup.sh\",\
          \"echo BACKUP_BUCKET=${BACKUP_BUCKET} > backup.env\",\
          \"echo AWS_REGION=${AWS_REGION} >> backup.env\",\
          \"echo $BACKUP_SERVICE_B64 | base64 -d > /etc/systemd/system/freezehub-backup.service\",\
          \"echo $BACKUP_TIMER_B64 | base64 -d > /etc/systemd/system/freezehub-backup.timer\",\
          \"chmod 644 /etc/systemd/system/freezehub-backup.service /etc/systemd/system/freezehub-backup.timer\",\
          \"systemctl daemon-reload\",\
          \"systemctl enable --now freezehub-backup.timer\",\
          \"docker compose pull\",\
          \"docker compose up -d --wait --wait-timeout 180\",\
          \"docker image prune -f\"]" \
            --query 'Command.CommandId' --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent $COMMAND_ID"

      # The step above only proves the API accepted the command. A deploy that reports
      # success because a request was accepted is worse than one that reports nothing, so
      # this waits for the real outcome and fails the workflow on it.
      - name: Wait for it to actually finish
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -uo pipefail
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "Deploy succeeded."; exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "Deploy $STATUS. Output follows:" >&2
                aws ssm get-command-invocation --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text >&2 || true
                echo "" >&2
                echo "Read the logs: docs/14-operations.md, 'A deploy failed'." >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting on $COMMAND_ID. See docs/14-operations.md." >&2
          exit 1

      - name: Where to look if something is wrong
        if: always()
        run: |
          echo "Shell on the box (there is no SSH):"
          echo "  aws ssm start-session --target ${{ inputs.instance_id }} --region ${{ vars.AWS_REGION }}"
          echo "Rollback is this workflow again with an earlier image_tag."
          echo "Runbook: docs/14-operations.md"
