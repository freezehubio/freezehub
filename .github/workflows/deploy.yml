# Deploying a build to an environment (FZ-064).
#
# NOT YET RUN. There is no AWS account provisioned and no ECR repository to push to, so
# this has never executed — see FZ-064 in docs/08-backlog.md for exactly what that leaves
# unproven.
#
# Manual rather than automatic on merge: deploying is a decision, and the product this
# repository builds exists because deploying at the wrong moment is a real problem.
#
# **The action versions here are the only ones in the repository no run has proved**
# (`FZ-140`, `OI-33`). They were bumped off the deprecated node20 runtime with the rest,
# and `verify.yml` demonstrates the shared ones — but nothing can execute this file until
# an AWS account exists (`FZ-138`, `FZ-123`), so the first dispatch is still the first
# time it runs. The one behaviour change that had to be read rather than watched is
# `configure-aws-credentials` v5 altering how invalid *boolean* inputs are handled; this
# workflow passes none, only `role-to-assume` and `aws-region`.
#
# **Three workflows since FZ-166, not one.** This file was a single job that built the
# image, rolled out ECS and published the SPA. Two of those three are shared with the
# single-box posture (D-35), and on that posture this workflow cannot run at all — it
# would push the image and then fail on `aws ecs describe-task-definition`. The build and
# the frontend publish are now `build-image.yml` and `deploy-frontend.yml`, callable
# alone; what is left here is the part that is genuinely ECS.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: beta
        type: choice
        options: [beta]

# id-token is what makes this work without storing AWS credentials in GitHub: the runner
# exchanges a short-lived OIDC token for a role, so there is no long-lived secret to leak
# and nothing to rotate. The trust policy in infra/shared/github-oidc.tf is scoped to this
# repository and this branch.
permissions:
  contents: read
  id-token: write

# Two deploys racing would leave the service on whichever image finished second, which is
# not necessarily the newer one. Shared with the called workflows: a reusable workflow
# inherits the caller's concurrency group, so this covers the build and the frontend too.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/build-image.yml
    with:
      environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

  rollout:
    needs: image
    runs-on: ubuntu-latest
    # NO `environment:` HERE, and it is not an oversight (FZ-206). A job that declares one
    # makes GitHub change the OIDC subject claim from
    #   repo:freezehubio/freezehub:ref:refs/heads/master
    # to
    #   repo:freezehubio/freezehub:environment:beta
    # and the trust policy in infra/shared/github-oidc.tf allows only the first. The first
    # real release failed here, on both jobs that declared one and on neither that did not.
    #
    # Keeping the branch in the subject is the point rather than a workaround: it is IAM
    # that then enforces "only master deploys", which a repository admin cannot change. An
    # environment's deployment-branch rule is the same restriction owned by someone else.
    #
    # `beta` carried no protection rules and no scoped secrets, so it was enforcing nothing
    # and granting nothing. Every variable and secret these workflows read is repository-level.


    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # A new task definition revision, not `--force-new-deployment`: forcing a
      # deployment redeploys whatever revision the service currently has, and that one
      # still names the *previous* image. It would look like a successful deploy and ship
      # nothing.
      - name: Describe the current task definition
        id: current
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --query taskDefinition > task-definition.json

      - name: Point it at the new image
        id: rendered
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          # ECR_REPOSITORY_URL, which already carries registry and repository (`FZ-201`).
          # `ECR_REPOSITORY` was never a repository variable, so this rendered a task
          # definition pointing at an empty repository name.
          image: ${{ vars.ECR_REPOSITORY_URL }}:${{ needs.image.outputs.image_tag }}

      # Deliberately NOT `terraform apply`. Applying from CI would need a role able to
      # change the database, the certificates and the user pool — far more than deploying
      # needs. Terraform stays a human operation, and the service's task_definition is
      # under lifecycle.ignore_changes so the two do not fight over the image tag.
      #
      # wait-for-service-stability turns a failing deploy into a failing job: ECS rolls
      # back on its own (deployment_circuit_breaker), but without this the workflow would
      # report success while the rollback was still happening.
      - name: Deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.rendered.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

  frontend:
    needs: rollout
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
