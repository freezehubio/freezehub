spring:
  application:
    name: freezehub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/freezehub}
    username: ${SPRING_DATASOURCE_USERNAME:freezehub}
    password: ${SPRING_DATASOURCE_PASSWORD:freezehub}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
  # Declared before email is ever switched on, because JavaMail's own defaults are *no*
  # timeout at all (FZ-065). Delivery runs inside a transaction on the one dispatcher every
  # organization shares, so an SMTP server that accepts the connection and then stops
  # answering would hold that transaction — and everyone else's announcements — open
  # indefinitely. Same reasoning as the outbound HTTP timeouts in OutboundHttpConfig; this
  # is the half of it that has no builder to customise. Milliseconds, as JavaMail wants.
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

# Deployed behind an Application Load Balancer (FZ-063), which terminates the client
# connection and appends the real address to X-Forwarded-For. Without this every request
# looks like it came from the load balancer, which would put every customer in one bucket
# for the per-IP rate limiter (FZ-087) and refuse them all together.
#
# Trusting a forwarded header is only safe because nothing reaches these tasks except
# through that load balancer - they sit in private subnets with no other ingress.
#
# The local profile turns it back OFF, explicitly. Leaving it unset there is not enough:
# a profile document merges with this one rather than replacing it, so this value would
# apply locally too and X-Forwarded-For would be trusted with no proxy in front - letting
# any caller choose their own rate-limit bucket, or fill somebody else's. Found by a test,
# not by reading.
server:
  forward-headers-strategy: framework

freezehub:
  # cognito:
  #   user-pool-id: ...
  #   region: ...
  #   client-id: ...
  #
  # Deliberately absent rather than merely unset (FZ-046). Outside the `local` profile
  # CognitoIdentityProvider is the IdentityProvider, and neither property has a default, so
  # an environment that forgets them fails to start rather than failing at the first
  # invitation — the same fail-fast as the encryption key and the missing JwtDecoder.
  # Supplied as FREEZEHUB_COGNITO_USER_POOL_ID, FREEZEHUB_COGNITO_REGION and
  # FREEZEHUB_COGNITO_CLIENT_ID, alongside the resource server issuer-uri. Under `local`
  # neither is read, because LocalIdentityProvider is the bean there.
  cors:
    # Empty by default: a deployed environment must name its frontend origin explicitly
    # rather than inherit a permissive default. The local profile below fills in Vite.
    allowed-origins: ${FREEZEHUB_CORS_ALLOWED_ORIGINS:}
  lifecycle:
    # Reconciles restriction status against the wall clock (FZ-025). The persisted
    # timestamps stay authoritative; this only keeps the stored status in step with them.
    enabled: true
    interval: PT1M
  notifications:
    # Drains the notification outbox (FZ-041). Bounded retry and backoff are FZ-044.
    enabled: true
    interval: PT30S
    # freezehub.notifications.email.from is deliberately NOT declared here. The email
    # sender is @ConditionalOnProperty on it, and an empty value would count as present —
    # registering a sender with a blank from-address. Absent means absent: EMAIL
    # notifications then defer instead of failing.
    #
    # To enable email, set FREEZEHUB_NOTIFICATIONS_EMAIL_FROM plus spring.mail.* (SES
    # exposes an SMTP endpoint, so the same configuration works locally and deployed).

# Every log line carries the request id set by RequestIdFilter, so a report of "it failed
# around three" becomes an exact lookup — and so two concurrent requests can be told apart
# in a single stream, which timestamps alone cannot do with two tasks running (FZ-062).
logging:
  pattern:
    level: "%5p [%X{requestId:-no-request}]"
  level:
    # The application's own reasoning: reconciliation results, dispatch outcomes,
    # abandoned notifications. Everything below stays at Spring's defaults.
    com.freezhub: INFO

management:
  endpoints:
    web:
      exposure:
        # health is public (the load balancer reads it); the rest are ADMINISTRATOR-only,
        # because the counters are aggregate across every tenant (FZ-065 — until then
        # authentication alone was the bar, which any member of any organization clears).
        # A separate management port the internet cannot reach is the real answer, and it
        # is deployment work: OI-21.
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      # Liveness answers "is this process wedged"; readiness answers "can it serve yet".
      # They are different questions, and answering the second with the first is what
      # makes a container get killed mid-migration.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

---
# Local development only. Kept in this file as a profile document rather than a separate
# application-local.yml, which the test classpath would shadow.
spring:
  config:
    activate:
      on-profile: local

# Not 8080 for local development: it is the default for half the JVM ecosystem, so on a
# machine running anything else it is usually taken. Deployed environments keep 8080 —
# the container, the ALB target group and the security groups are all written around it,
# and nothing else on a Fargate task is competing for the port.
#
# Override with SERVER_PORT if 8099 is taken too.
server:
  port: ${SERVER_PORT:8099}
  # No proxy in front locally, so nothing may claim to be one. Explicit rather than
  # omitted: profile documents merge, so the deployed value above would otherwise apply.
  forward-headers-strategy: none

freezehub:
  cors:
    allowed-origins: ${FREEZEHUB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  secrets:
    # A fixed development key, committed on purpose and worth exactly nothing: it protects
    # only a local database. It exists under this profile alone so that a deployed
    # environment MUST supply its own — there is deliberately no default outside `local`,
    # and the application refuses to start without one (FZ-049).
    encryption-key: ZGV2ZWxvcG1lbnQtb25seS1rZXktbm90LXNlY3JldCE=
