<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FreezeHub">
  <!-- Option 3a from the design deck: the literal crop of the 2c wordmark — the
       initial and the magenta point. The square is the text ink (#201e1d), the F is
       the paper (#f3f2f2), and the point is accent-2-500 (#ff458e), which is the
       lighter magenta because it sits on ink rather than on paper.

       Values are the Broadsheet tokens written out, not referenced: a favicon is
       rendered outside the document, so it cannot see the app's CSS custom
       properties. If those tokens are retuned, this file is retuned with them.

       The letterform is <text>, not an outline, so it depends on a serif being
       present. Source Serif 4 is a webfont and a favicon does not fetch webfonts —
       the stack falls back to Georgia, close enough in colour and weight at 16px,
       which is the size 3a was chosen to survive. Outlining the glyph would make it
       exact everywhere and is the durable fix; it needs the font binary and a tool
       to extract the path, which is a separate job. -->
  <rect width="64" height="64" fill="#201e1d"/>
  <text x="32" y="47" text-anchor="middle"
        font-family="'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif"
        font-size="44" font-weight="600" letter-spacing="-0.88"
        fill="#f3f2f2">F<tspan fill="#ff458e">.</tspan></text>
</svg>
